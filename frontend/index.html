<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge Security Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; color: #38bdf8; }
    
    .status-badge { background: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
    
    .container { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; padding: 1.5rem; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    .video-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .video-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #0f172a; padding: 0.75rem 1rem; border-radius: 8px; }
    
    button { background: #0284c7; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }

    .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .panel h2 { font-size: 1rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    
    .detection-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; max-height: 200px; overflow-y: auto; }
    .detection-item { background: #0f172a; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; border-left: 3px solid #38bdf8; }
    
    #geminiOutput { background: #0f172a; padding: 0.75rem; border-radius: 6px; font-size: 0.88rem; line-height: 1.4; color: #cbd5e1; min-height: 120px; white-space: pre-wrap; }
    
    svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      Live AI Surveillance
    </h1>
    <span class="status-badge" id="backendStatus">Connecting...</span>
  </header>

  <div class="container">
    <div class="video-card">
      <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="controls">
        <button id="toggleVoiceBtn" onclick="toggleVoice()">
          <svg id="voiceIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <span id="voiceText">Voice: ON</span>
        </button>

        <button class="secondary" onclick="triggerGemini()">
          <svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 3 6.5 9.5 0 12l6.5 2.5L9 21l2.5-6.5L18 12l-6.5-2.5z"/></svg>
          Ask AI Description
        </button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          Live Feed Detections
        </h2>
        <ul class="detection-list" id="detectionList">
          <li class="detection-item">Scanning video stream...</li>
        </ul>
      </div>

      <div class="panel">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
          Gemini AI Analysis
        </h2>
        <div id="geminiOutput">Click 'Ask AI Description' to generate a frame analysis...</div>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'http://127.0.0.1:8000';
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    
    let voiceEnabled = true;
    let lastSpokenText = "";
    let isProcessingFrame = false;
    let availableVoices = [];
    let selectedVoice = null;

    // Load natural female/male voice profiles (filtering out robotic "Fred")
    function loadNaturalVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      
      selectedVoice = availableVoices.find(v => 
        v.name.includes("Samantha") || 
        v.name.includes("Google US English") || 
        v.name.includes("Karen") || 
        v.name.includes("Victoria")
      ) || availableVoices.find(v => v.lang.startsWith("en") && !v.name.includes("Fred")) || availableVoices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadNaturalVoices;
      loadNaturalVoices();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          checkBackendStatus();
          setInterval(analyzeFrame, 900);
        };
      } catch (err) {
        alert("Camera access denied or unavailable: " + err);
      }
    }

    async function checkBackendStatus() {
      try {
        const res = await fetch(`${BACKEND_URL}/`);
        if (res.ok) {
          document.getElementById('backendStatus').innerText = 'API Connected';
          document.getElementById('backendStatus').style.background = '#16a34a';
        }
      } catch {
        document.getElementById('backendStatus').innerText = 'API Offline';
        document.getElementById('backendStatus').style.background = '#dc2626';
      }
    }

    async function analyzeFrame() {
      if (isProcessingFrame) return;
      isProcessingFrame = true;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0);

      tempCanvas.toBlob(async (blob) => {
        if (!blob) { isProcessingFrame = false; return; }
        
        const formData = new FormData();
        formData.append('file', blob, 'frame.jpg');

        try {
          const res = await fetch(`${BACKEND_URL}/api/analyze`, { method: 'POST', body: formData });
          if (res.ok) {
            const data = await res.json();
            renderDetections(data);
          }
        } catch (e) {
          console.error("Frame analysis error:", e);
        } finally {
          isProcessingFrame = false;
        }
      }, 'image/jpeg', 0.8);
    }

    // --- State variables for Voice Cooldown ---
    let isAdminPresent = false;
    let adminMissingFrames = 0;
    const MISSING_THRESHOLD = 3; // Number of frames absent before resetting greeting

    function renderDetections(data) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const listEl = document.getElementById('detectionList');
      listEl.innerHTML = '';
      let spokenItems = [];

      // 1. ADMIN FACE RECOGNITION (Greet ONCE on entry)
      if (data.identity && data.identity === 'Mahi_admin') {
        adminMissingFrames = 0; // Reset absent counter since you are visible

        // Visual Bounding Overlay
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        ctx.fillStyle = '#22c55e';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(`AUTHORIZED: ${data.identity}`, 30, 50);

        listEl.innerHTML += `<li class="detection-item" style="border-left-color: #22c55e;"><strong>Identity:</strong> ${data.identity}</li>`;

        // Greet ONLY if you were not previously in frame
        if (!isAdminPresent) {
          isAdminPresent = true;
          speakText("Welcome back, Admin Mahi");
        }
      } else {
        // Admin not detected in this frame
        if (isAdminPresent) {
          adminMissingFrames++;
          // Only mark as gone if missing for 3 consecutive frames (~3 seconds)
          if (adminMissingFrames >= MISSING_THRESHOLD) {
            isAdminPresent = false;
          }
        }
      }

      // 2. YOLO OBJECT DETECTIONS
      if (data.objects && data.objects.length > 0) {
        data.objects.forEach(obj => {
          const [x, y, w, h] = obj.box;
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);

          ctx.fillStyle = '#0284c7';
          ctx.fillRect(x, y - 28 > 0 ? y - 28 : y, ctx.measureText(obj.label).width + 20, 26);
          ctx.fillStyle = '#ffffff';
          ctx.font = '16px sans-serif';
          ctx.fillText(obj.label, x + 5, (y - 28 > 0 ? y - 28 : y) + 18);

          listEl.innerHTML += `<li class="detection-item"><span>Object</span><strong>${obj.label}</strong></li>`;
        });
      }

      if (listEl.innerHTML === '') {
        listEl.innerHTML = '<li class="detection-item">Scanning... No targets in frame</li>';
      }
    }

    function speakText(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const voiceText = document.getElementById('voiceText');
      const voiceBtn = document.getElementById('toggleVoiceBtn');

      if (voiceEnabled) {
        voiceText.innerText = "Voice: ON";
        voiceBtn.className = "";
        speakText("Voice alert enabled");
      } else {
        voiceText.innerText = "Voice: OFF";
        voiceBtn.className = "danger";
        window.speechSynthesis.cancel();
      }
    }

    async function triggerGemini() {
      const outputEl = document.getElementById('geminiOutput');
      outputEl.innerText = "Analyzing frame with Gemini AI...";

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(video, 0, 0);

      tempCanvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('file', blob, 'frame.jpg');

        try {
          const res = await fetch(`${BACKEND_URL}/api/gemini`, { method: 'POST', body: formData });
          const data = await res.json();
          outputEl.innerText = data.response || "No response received.";
        } catch (e) {
          outputEl.innerText = "Error connecting to Gemini API endpoint.";
        }
      }, 'image/jpeg', 0.8);
    }

    window.onload = startWebcam;
  </script>
</body>
</html>
